version: '3.8'

services:
  # Backend API Server - Proxies token requests to OAN backend
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: demo-ui-api
    ports:
      - "3001:3001"
    environment:
      # OAN backend URL for token-for-phone endpoint
      - OAN_API_URL=${OAN_API_URL:-http://host.docker.internal:8000}
      # API key matching DEMO_UI_API_KEY on the OAN backend
      - DEMO_UI_API_KEY=${DEMO_UI_API_KEY:-}
      - PORT=3001
    command: npm run dev:server
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - demo-ui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Vite Dev Server
  demo-ui:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: demo-ui-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_CHAT_BASE_URL=${VITE_CHAT_BASE_URL:-https://dev-amulmitra.amul.com}
      - VITE_API_SERVER=http://api-server:3001
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - demo-ui-network
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped

networks:
  demo-ui-network:
    driver: bridge
